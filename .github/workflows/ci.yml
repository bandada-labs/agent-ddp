name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path cli/Cargo.toml
      - run: cargo clippy --release --manifest-path cli/Cargo.toml -- -D warnings
      - run: cargo test --release --manifest-path cli/Cargo.toml
      - run: cargo build --release --manifest-path cli/Cargo.toml
      - run: python3 cli/test_ddp.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./samples/android/gradlew -p samples/android :agent-ddp:testDebugUnitTest :agent-ddp:assembleRelease :app:assembleDebug

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -scheme AgentDDP -destination 'generic/platform=iOS Simulator' build
      - name: Unit tests on the first available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['name'].startswith('iPhone')))")
          xcodebuild test -scheme AgentDDP -destination "id=$udid"
