name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path cli/Cargo.toml
      - run: cargo clippy --release --manifest-path cli/Cargo.toml -- -D warnings
      - run: cargo test --release --manifest-path cli/Cargo.toml
      - run: cargo build --release --manifest-path cli/Cargo.toml
      - run: python3 cli/test_ddp.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./samples/android/gradlew -p samples/android :agent-ddp:testDebugUnitTest :agent-ddp:assembleRelease :app:assembleDebug

  ios:
    runs-on: macos-15
    env:
      # Xcode 16.0, the oldest one the README supports and the runner has: a newer Xcode accepts what it does not.
      DEVELOPER_DIR: /Applications/Xcode_16.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme AgentDDP -destination 'generic/platform=iOS Simulator' build
      - name: The sample app, as an app adding the package by path builds it
        # The project is generated from samples/ios/project.yml, not kept in git.
        run: |
          brew install xcodegen
          (cd samples/ios && xcodegen)
          xcodebuild -project samples/ios/DDPSample.xcodeproj -scheme DDPSample -destination 'generic/platform=iOS Simulator' build
      - name: Plain swiftc, for apps without an Xcode project or SwiftPM
        run: ios/build-swiftc.sh simulator && ios/build-swiftc.sh device
      - name: Unit tests on the first available iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['name'].startswith('iPhone')))")
          xcodebuild test -scheme AgentDDP -destination "id=$udid"
