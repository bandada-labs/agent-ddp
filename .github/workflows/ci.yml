name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check --manifest-path cli/Cargo.toml
      - run: cargo clippy --release --manifest-path cli/Cargo.toml -- -D warnings
      - run: cargo test --release --manifest-path cli/Cargo.toml
      - run: cargo build --release --manifest-path cli/Cargo.toml
      - run: python3 cli/test_ddp.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./samples/android/gradlew -p samples/android :agent-ddp:assembleRelease :app:assembleDebug

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme AgentDDP -destination 'generic/platform=iOS Simulator' build
