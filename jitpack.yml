# JitPack builds the Android library from a tag: debugImplementation("com.github.bandada-labs:agent-ddp:<tag>")
# No `cd` here: JitPack finds nothing when the install command changes directory.
jdk:
  - openjdk17
install:
  - ./samples/android/gradlew -p samples/android :agent-ddp:publishReleasePublicationToMavenLocal -PpublishVersion="$VERSION"
